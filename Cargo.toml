[package]
name = "hwp-rs"
version = "0.1.0"
edition = "2021"
description = "Rust parser for Hancom Office HWP5 (.hwp) and HWPX (.hwpx) documents"
license = "MIT"
repository = "https://github.com/coreonai/hwp-rs"
homepage = "https://github.com/coreonai/hwp-rs"
keywords = ["hwp", "hwpx", "hancom", "parser", "korean"]
categories = ["parser-implementations", "text-processing"]
readme = "README.md"

[dependencies]
cfb = "0.10"
flate2 = "1"
quick-xml = "0.36"
zip = "2"
thiserror = "2"
byteorder = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "json_dump"
path = "src/bin/json_dump.rs"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
